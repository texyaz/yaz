blank_issues_enabled: false
contact_links:
  - name: 🚀 Request new functionality
    url: https://github.com/texyaz/yaz/discussions/new?category=features
    about: >
      Ask for a capability yaz does not have yet. Starts as a discussion so
      scope and design get agreed before code. Accepted requests become issues.

  - name: ⚡ Suggest an optimization
    url: https://github.com/texyaz/yaz/discussions/new?category=optimization
    about: >
      Make existing, working behavior faster or lighter. Needs a same-harness
      measurement, not an intuition. Does not change what yaz can do.

  - name: 💬 Ask a question
    url: https://github.com/texyaz/yaz/discussions/new?category=questions
    about: >
      How do I use this? Why does it behave this way? Answers get marked so the
      next person finds them.

  - name: 🙌 Show what you built
    url: https://github.com/texyaz/yaz/discussions/new?category=show-and-tell
    about: A plugin, a theme, a template, a paper you wrote with it.

  - name: 📖 Documentation
    url: https://generalpawz.github.io/yaz/
    about: Guides, reference, and the plugin API.

  - name: 🗺️ Roadmap and current state
    url: https://github.com/orgs/texyaz/projects/1
    about: Milestones carry the exit criteria; the board carries the workflow.

  - name: 🔒 Security vulnerability
    url: https://github.com/texyaz/yaz/security/advisories/new
    about: Report privately, never as a public issue. See SECURITY.md for what is in scope.
