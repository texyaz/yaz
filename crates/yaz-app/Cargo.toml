[package]
name = "yaz-app"
description = "The yaz desktop application binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
name = "yaz_app"
path = "src/lib.rs"

[[bin]]
name = "yaz"
path = "src/main.rs"

# The web server (ADR-0030). Behind a feature so that a desktop build compiles
# neither an HTTP server nor Tauri's mock runtime.
[[bin]]
name = "yaz-web"
path = "src/web.rs"
required-features = ["web"]

[features]
default = []

# Forwards to yaz-compile's feature of the same name. yaz-app needs its own
# declaration because `cfg!(feature = ...)` only sees features of the crate it
# is compiled in — without this, the check silently reads false and the engine
# picker would report Tectonic as missing from a build that actually has it.
tectonic-engine = ["yaz-compile/tectonic-engine"]

# Typst. Pure Rust, so unlike tectonic-engine this needs no vcpkg and builds
# anywhere — but it compiles a different document language, not .tex.
typst-engine = ["yaz-compile/typst-engine"]

# The web server: the same commands over HTTP, for a yaz that runs on one
# machine and is used from a browser on another (ADR-0030).
web = ["tauri/test", "dep:axum", "dep:tower-http", "dep:sha2", "dep:getrandom"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
yaz-core.workspace = true
yaz-latex.workspace = true
yaz-compile.workspace = true
yaz-plugin.workspace = true
yaz-zotero.workspace = true
yaz-obsidian.workspace = true
yaz-vcs.workspace = true
yaz-mcp.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

anyhow.workspace = true
camino.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
keyring.workspace = true
url.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
walkdir.workspace = true
# The plugin host is async: Zotero probing must not block the command thread,
# and the library is shared state behind an RwLock.
tokio = { workspace = true, features = ["net", "signal"] }
reqwest.workspace = true
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
tower-http = { version = "0.6", optional = true, features = ["fs", "compression-gzip"] }
# Sign-in for the web server (ADR-0033): the PKCE challenge and the random
# names of sessions. Both pure Rust, so nothing here needs a C toolchain.
sha2 = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }
trash = { version = "5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }

# yaz-app stays THIN: it wires the domain crates to Tauri commands and holds no
# domain logic of its own (ADR-0017). Anything here that starts to look like a
# decision about LaTeX, projects, or plugins belongs in a domain crate.

[dev-dependencies]
tempfile.workspace = true
# Builds a Zotero fixture library, so the citation path is exercised end to end
# rather than only in pieces.
rusqlite = { workspace = true }
