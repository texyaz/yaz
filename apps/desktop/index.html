<!doctype html>
<html lang="en" data-yaz-theme="yaz-dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <title>yaz</title>
    <!-- The app's own icon, for a browser tab and a phone's home screen. The
         desktop window takes its icon from the bundle and ignores these. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../crates/yaz-app/icons/32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="../../crates/yaz-app/icons/128x128.png"
    />
    <link
      rel="apple-touch-icon"
      href="../../crates/yaz-app/icons/128x128@2x.png"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
